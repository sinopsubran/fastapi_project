name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  PROJECT_ID: disclozedesgin
  REGION: asia-south1
  REPOSITORY: backend
  IMAGE: backend
  SERVICE: backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t asia-south1-docker.pkg.dev/disclozedesgin/backend/backend:${{ github.sha }} \
            -f backend/Dockerfile \
            backend

      - name: Push Docker image
        run: |
          docker push \
            asia-south1-docker.pkg.dev/disclozedesgin/backend/backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend \
            --image=asia-south1-docker.pkg.dev/disclozedesgin/backend/backend:${{ github.sha }} \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated
