name: Deploy to Cloud Run

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  PROJECT_ID: disclozedesgin
  REGION: asia-south1
  REPOSITORY: my-repo          # Replace with your Artifact Registry repository
  SERVICE: my-cloudrun-service # Replace with your Cloud Run service name
  IMAGE: my-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Show repository structure
        run: |
          pwd
          find . -name Dockerfile
          ls -R

      - name: Build Docker Image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t asia-south1-docker.pkg.dev/disclozedesgin/my-repo/my-app:${{ github.sha }} \
            frontend

      - name: Push Docker Image
        run: |
          docker push asia-south1-docker.pkg.dev/disclozedesgin/my-repo/my-app:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy my-cloudrun-service \
            --image asia-south1-docker.pkg.dev/disclozedesgin/my-repo/my-app:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated
