name: Deploy frontend to Firebase Hosting

on:
  push:
    branches:
      - development

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Create .env from GitHub variables
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          if [ -n "$VITE_API_URL" ]; then
            sed -i "s|^VITE_API_URL=.*|VITE_API_URL=$VITE_API_URL|" .env
          fi
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8000' }}

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISCLOZEDEVELOPMENT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'disclozedesgin' }}
          entryPoint: frontend
